[workspace]
resolver = "3"
# vedit-py is intentionally excluded from the default workspace because
# pyo3's `extension-module` feature can't link in a plain `cargo build`
# — it's built via maturin (`cd crates/vedit-py && maturin develop`).
default-members = [
    "crates/vedit-core",
    "crates/vedit-cli",
]
members = [
    "crates/vedit-core",
    "crates/vedit-cli",
    "crates/vedit-py",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/explicit09/vedit"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
