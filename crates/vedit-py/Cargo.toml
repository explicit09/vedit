[package]
name = "vedit-py"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Python bindings for vedit — version control for video timelines."

[lib]
name = "vedit"
crate-type = ["cdylib"]

[dependencies]
vedit-core = { path = "../vedit-core" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
# abi3-py39 means: build a single wheel per platform that works on
# CPython 3.9+. Without this we'd have to ship a separate wheel per
# minor Python version. abi3 also avoids a Windows-specific issue with
# pyo3's bundled sysconfig that fails the build on hosts that don't
# have every Python version installed.
pyo3 = { version = "0.26", features = ["extension-module", "anyhow", "abi3-py39"] }
pythonize = "0.26"
