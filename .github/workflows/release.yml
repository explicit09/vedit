name: release

# Build wheels and an sdist for `pyvedit`.
# - On push to main / pull requests: build all targets, run Rust/Python
#   tests plus Rust formatting and clippy checks, but do not publish.
# - On a `v*` tag (e.g. `v0.0.1`): build all targets, then publish to
#   PyPI using the PYPI_API_TOKEN secret.
#
# The Python module is `vedit`; the PyPI distribution is `pyvedit`.
# That mapping is set in crates/vedit-py/pyproject.toml.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --check
      - name: cargo clippy
        run: cargo clippy --workspace --exclude vedit-py -- -D warnings
      - name: cargo test
        run: cargo test --workspace --exclude vedit-py

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create test venv
        run: python -m venv .venv
      - name: Install test tooling
        run: .venv/bin/python -m pip install --upgrade pip maturin pytest
      - name: Build extension in place
        working-directory: crates/vedit-py
        run: ../../.venv/bin/maturin develop --release
      - name: pytest
        run: .venv/bin/python -m pytest crates/vedit-py/tests/

  build-linux:
    name: Wheels - Linux ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/vedit-py
          target: ${{ matrix.target }}
          args: --release --strip
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: target/wheels/*.whl

  # macOS arm64 only for v0.0.1. The macOS Intel runner pool (`macos-13`)
  # has unreliable queue times — multi-minute waits even for a 35-second
  # build, blocking the whole release. Apple stopped selling Intel Macs
  # in 2023; anyone still on x86_64 can build from source via maturin.
  # We can add `macos-13` back when we need it.
  build-macos:
    name: Wheels - macOS aarch64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/vedit-py
          target: aarch64
          args: --release --strip
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-aarch64
          path: target/wheels/*.whl

  build-windows:
    name: Wheels - Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/vedit-py
          target: x64
          args: --release --strip
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x86_64
          path: target/wheels/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/vedit-py
          command: sdist
          args: --out ../../target/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: target/wheels/*.tar.gz

  publish-to-pypi:
    name: Publish to PyPI
    needs:
      [
        rust-checks,
        python-tests,
        build-linux,
        build-macos,
        build-windows,
        build-sdist,
      ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Publish to PyPI
        uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
